aid: fable
name: Fable
description: >-
  Fable Security is an AI-powered human risk management (HRM) platform that helps
  security teams reduce incidents by changing employee behavior. It combines
  behavioral interventions (targeted nudges and AI-generated content), phishing
  simulations, short-form video awareness briefings, and human-risk reporting into
  a single platform positioned as a modern replacement for legacy security-awareness
  training. Fable's AI Studio, Composer, and Briefing Agent generate custom video
  and audio content - including deepfake and voice-fake simulations - and produce
  audience-targeted briefings from emerging threats in minutes. The platform reports
  on human risk and compliance across the workforce and integrates with an
  organization's identity framework, workspace, and security tooling. Fable serves
  healthcare, financial services, and technology customers including Sisense,
  SanDisk, Red Hat, PennyMac, Genesys, and Dayton Children's Hospital, and is backed
  by Greylock and Techstars.
